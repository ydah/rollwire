AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.1
  Exclude:
    - "gemfiles/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "rollwire.gemspec"

Metrics/MethodLength:
  Exclude:
    - "spec/**/*"

Gemspec/DevelopmentDependencies:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes
